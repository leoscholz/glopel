<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espelho Start — Glopel</title>
<style>
:root{
  --bar:#2b2d36;--bar2:#3a3d48;--lav:#e4e2f6;--lav2:#cfc9f0;--sel:#b9a9ea;--hdr:#f4f4f7;
  --line:#d6d6de;--ink:#23232b;--mute:#6d6d78;--blue:#1d3f8f;--red:#c62828;--green:#2e7d32;
  --win:#fbfbfd;--dlgbar:#1f2130;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px "Segoe UI",Tahoma,system-ui,sans-serif;color:var(--ink);background:#e9e9ef;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit}
/* ---------- topo ---------- */
.mods{display:flex;align-items:stretch;background:var(--bar);color:#ddd;height:26px;padding-left:6px}
.mods button{background:none;border:0;color:#cfcfd6;padding:0 18px;cursor:pointer;border-right:1px solid #444}
.mods button.on{background:#14151b;color:#fff}
.mods .title{flex:1;text-align:center;align-self:center;font-size:12px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.mods .ro{align-self:center;background:#7e57c2;color:#fff;font-size:11px;padding:2px 8px;border-radius:3px;margin-right:8px}
.tabs{display:flex;gap:2px;background:#f0f0f4;border-bottom:1px solid var(--line);padding:4px 6px 0;overflow-x:auto}
.tabs .app{background:#5b3fa6;color:#fff;border:0;padding:3px 10px;border-radius:3px 3px 0 0;margin-right:6px}
.tabs button.t{background:none;border:1px solid transparent;border-bottom:0;padding:4px 12px;cursor:pointer;color:#333;white-space:nowrap;text-transform:uppercase;font-size:12px}
.tabs button.t.on{background:#fff;border-color:var(--line);color:var(--blue);position:relative;top:1px}
.ribbon{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:4px 4px 0;min-height:88px;overflow-x:auto}
.grp{display:flex;flex-direction:column;border-right:1px solid #e3e3ea;padding:0 4px}
.grp .btns{display:flex;gap:2px;flex:1}
.grp .gl{text-align:center;font-size:11px;color:var(--mute);padding:2px 0 3px}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;width:68px;padding:4px 2px;border:1px solid transparent;background:none;cursor:pointer;font-size:11px;line-height:1.15;color:#333;text-align:center}
.rb:hover{background:var(--lav);border-color:var(--lav2)}
.rb.on{background:var(--sel);border-color:#9f8de0}
.rb.dis{opacity:.4;cursor:not-allowed}
.rb .ic{font-size:24px;line-height:30px;height:30px}
/* ---------- corpo ---------- */
.body{flex:1;display:flex;min-height:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff;margin:6px 0 6px 6px;border:1px solid var(--line)}
.vtitle{font-size:17px;color:#555;padding:6px 10px;border-bottom:1px solid #eee}
.grid{flex:1;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th{position:sticky;top:0;background:#fff;text-align:left;font-weight:600;color:#333;padding:4px 6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;font-size:12px}
th.r,td.r{text-align:right}
td{padding:2px 6px;white-space:nowrap;border-bottom:1px solid #f1f1f4;color:#2a2a2a;max-width:260px;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#f3f1fc}
tr.sel td{background:var(--sel)}
.st{display:inline-flex;align-items:center;gap:4px}
.ok{color:var(--green)}.late{color:var(--red)}
.foot{display:flex;justify-content:space-between;padding:3px 10px;border-top:1px solid var(--line);background:#fafafc;font-size:12px;color:#555}
.side{width:170px;margin:6px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column}
.side input{margin:6px;padding:4px 6px;border:1px solid var(--line);font:inherit}
.side button{background:none;border:0;text-align:left;padding:5px 12px;cursor:pointer;color:#555}
.side button:hover{background:var(--lav)}
.side button.on{background:#5b3fa6;color:#fff}
.side .new{color:var(--green)}
.side .hd{font-size:11px;color:var(--mute);padding:6px 12px 2px;text-transform:uppercase}
.mx{background:#fff7e0;color:#8a5a00;border:1px solid #f0d9a0;border-radius:3px;padding:0 5px;font-size:11px}
.tag{display:inline-block;padding:0 6px;border-radius:3px;font-size:11px;font-weight:600}
.PAGO{background:#e3f3e3;color:#24692b}.ABERTO{background:#e7f1fb;color:#2b5d8f}.ATRASADO{background:#fbebeb;color:#9b2c2c}.CONFERIR{background:#f9eeda;color:#8a5a00}.BAIXADO{background:#efedff;color:#5a46b0}
.status{background:var(--bar);color:#ccc;font-size:11px;padding:2px 10px;display:flex;justify-content:space-between}
.empty{padding:40px;text-align:center;color:var(--mute)}
/* ---------- janelas ---------- */
.ov{position:fixed;inset:0;background:rgba(30,30,50,.25);display:flex;align-items:center;justify-content:center;z-index:10}
.dlg{background:var(--win);border:1px solid #999;box-shadow:0 8px 30px rgba(0,0,0,.3);width:min(980px,96vw);max-height:94vh;display:flex;flex-direction:column}
.dlg.sm{width:min(820px,96vw)}
.dh{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:#fff}
.dh b{font-weight:400;flex:1}
.dh .x{background:none;border:0;font-size:18px;cursor:pointer;color:#555}
.banner{background:var(--dlgbar);color:#fff;padding:3px 12px;font-size:12px}
.banner.okb{background:#2e5e3a}
.dtabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.dtabs span{padding:3px 10px;border:1px solid var(--line);border-bottom:0;background:#fff}
.dtabs span.off{background:none;border-color:transparent;color:#555}
.dbody{padding:10px 16px;overflow:auto}
.sec{font-size:16px;color:#555;margin:8px 0 6px;display:flex;align-items:center;gap:8px}
.sec:after{content:"";flex:1;border-top:1px solid #ccc}
.form{display:grid;grid-template-columns:110px 1fr 120px 220px;gap:6px 8px;align-items:center}
.form label{text-align:right;color:#444}
.form label.b{font-weight:600}
.fld{border:1px solid #c9c9d2;background:#fff;padding:2px 6px;min-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld.b{font-weight:700}
.fld.r{text-align:right}
.fld.dd:after{content:"▾";float:right;color:#333}
.ptool{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-bottom:0;background:#f6f6f9;padding:3px 8px;margin-top:10px;font-size:12px;color:#888}
.ptool .sp{flex:1}
.pgrid{border:1px solid var(--line);min-height:150px;background:#fff}
.pgrid table{min-width:0}
.ptot{text-align:right;padding:2px 8px;font-weight:600;color:#555}
.dfoot{display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);background:#f3f3f6}
.dfoot .sp{flex:1}
.wb{border:1px solid #b8b8c4;background:#fff;padding:4px 16px;cursor:pointer;min-width:90px}
.wb.p{background:#dfe9f8;border-color:#8fb0e0}
.wb.dis{color:#999;cursor:not-allowed}
.lwrap{display:flex;gap:40px;flex-wrap:wrap}.lcol{flex:1.4;min-width:260px;display:grid;grid-template-columns:120px 1fr;gap:6px 8px;align-items:center;align-content:start}.lcol.r{flex:1;grid-template-columns:130px 1fr}
.lcol label{text-align:right;color:#444}.lcol label.b{font-weight:600;color:#222}.lcol .tot{margin-top:6px}.lcol label.tot{border-top:1px solid #999;padding-top:6px}
.hint{margin-top:10px;padding:6px 10px;border:1px dashed #b9a9ea;background:#f6f3ff;color:#4b3a8c;font-size:12px}
.pista{border:1px solid var(--line);background:#fff;padding:10px 12px;margin:8px 10px}
.pista h3{margin:0 0 4px;font-size:14px}.pista p{margin:0;color:#444}.pista .q{color:#5b3fa6;font-size:12px;margin-top:4px}
@media (max-width:760px){.side{display:none}.form{grid-template-columns:90px 1fr}.form label{text-align:left}}
</style>
</head>

    if(a==='abrirParc'){if(S.sel)abrirParcela(S.sel);return}
    if(a==='carregar'){document.getElementById('arq').click();return}
    S.view=a;S.filtro=DEF_F[S.view]||'Todos';S.sel=null;render()});
}

/* ===== filtros de período ===== */
const DEF_F={pedidos:'Últimos 60 dias',receber:'Vencidos'};
const FILT={
 pedidos:['Recentes','Do dia','Últimos 7 dias','Mês Atual','Mês Anterior','Últimos 60 dias','Últimos 90 dias','Todos'],
 receber:['Vencidos','Vence hoje','Próximos 7 dias','Mês Atual','Pagos (falta baixar)','Conferir','Todos']
};
function passaPeriodo(d){const f=S.filtro;if(!d||f==='Todos')return true;const dd=dias(d,HOJE);
  if(f==='Do dia')return dd===0; if(f==='Recentes'||f==='Últimos 7 dias')return dd>=-7&&dd<=7; if(f==='Últimos 60 dias')return dd>=-60&&dd<=60; if(f==='Últimos 90 dias')return dd>=-90&&dd<=90;
  if(f==='Mês Atual')return d.slice(0,7)===HOJE.slice(0,7);
  if(f==='Mês Anterior'){const x=new Date(HOJE);x.setMonth(x.getMonth()-1);return d.slice(0,7)===x.toISOString().slice(0,7)}
  return true}
function passaReceber(r){const f=S.filtro,dd=dias(r.venc,HOJE);
  if(f==='Vencidos')return dd>0; if(f==='Vence hoje')return dd===0; if(f==='Próximos 7 dias')return dd<=0&&dd>=-7; if(f==='Mês Atual')return r.venc.slice(0,7)===HOJE.slice(0,7);
  if(f==='Pagos (falta baixar)')return r.st==='PAGO'; if(f==='Conferir')return r.st==='CONFERIR'; return true}
function drawSide(){
  const el=document.getElementById('side');const list=FILT[S.view];
  el.innerHTML='<input id="q" placeholder="Filtrar..." value="'+esc(S.q)+'">'+(list?list.map(f=>'<button class="'+(f===S.filtro?'on':'')+'">'+f+'</button>').join('')+'<button class="new">⊕ Novo Filtro…</button>':'');
  el.querySelectorAll('button:not(.new)').forEach(b=>b.onclick=()=>{S.filtro=b.textContent;drawGrid()});
  const q=el.querySelector('#q');q.oninput=()=>{S.q=q.value.toLowerCase();drawGrid()};
}

/* ===== grade genérica ===== */
function grade(title,cols,rows,onOpen,footTot){
  document.getElementById('vtitle').textContent=title;
  if(S.sort!=null&&cols[S.sort]){const c=cols[S.sort];rows=rows.slice().sort((a,b)=>{const x=c.v(a),y=c.v(b);return(x>y?1:x<y?-1:0)*(S.asc?1:-1)})}
  const G=document.getElementById('grid');
  G.innerHTML='<table><thead><tr>'+cols.map((c,i)=>'<th class="'+(c.r?'r':'')+'" data-i="'+i+'">'+c.h+(S.sort===i?(S.asc?' ▴':' ▾'):'')+'</th>').join('')+'</tr></thead><tbody>'+
   rows.slice(0,1500).map((r,i)=>'<tr data-i="'+i+'" class="'+(S.sel&&S.sel===r.id?'sel':'')+'">'+cols.map(c=>'<td class="'+(c.r?'r':'')+'">'+c.f(r)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  G.querySelectorAll('th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;S.asc=S.sort===i?!S.asc:true;S.sort=i;drawGrid()});
  G.querySelectorAll('tbody tr').forEach(tr=>{const r=rows[+tr.dataset.i];
    tr.onclick=()=>{S.sel=r.id;G.querySelectorAll('tr.sel').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel')};
    if(onOpen)tr.ondblclick=()=>onOpen(r.id)});
  document.getElementById('foot').innerHTML='<span>'+rows.length+' itens</span><span>'+(footTot!=null?brl(footTot):'')+'</span>';
}
const busca=(r,txt)=>!S.q||txt.toLowerCase().includes(S.q);

 pedidos(){const rows=pedidos().filter(p=>passaPeriodo(p.emis||p.venc)&&busca(p,p.pv+' '+p.cli+' '+p.vend)).map(p=>({...p,id:p.pv}));

  grade('Clientes',[{h:'Nome',f:c=>esc(c.cli)+marks(c.cli),v:c=>c.cli},{h:'Vendedor',f:c=>esc(c.vend||'—'),v:c=>c.vend},{h:'Parcelas abertas',f:c=>c.n,v:c=>c.n,r:1},{h:'Em aberto',f:c=>brl(c.val),v:c=>c.val,r:1},{h:'Vencido',f:c=>c.atr?'<span class="late">'+brl(c.atr)+'</span>':'',v:c=>c.atr,r:1},{h:'Último venc.',f:c=>fd(c.ult),v:c=>c.ult},{h:'Documentos',f:c=>esc(c.meios),v:c=>c.meios}],rows,null,sum(rows))},

  if(!comV.length){vazio('Vendedores','O export de Contas a Receber não traz o vendedor.<br>Vem do relatório de <b>Pedidos de Venda</b> (coluna Vendedor).');return}

  grade('Vendedores',[{h:'Vendedor',f:x=>esc(x.v),v:x=>x.v},{h:'Pedidos abertos',f:x=>x.n,v:x=>x.n,r:1},{h:'Clientes',f:x=>x.cl,v:x=>x.cl,r:1},{h:'Em aberto',f:x=>brl(x.val),v:x=>x.val,r:1}],rows,null,sum(rows))},
 produtos(){vazio('Produtos','Ainda sem dados: precisa do <b>cadastro de produtos</b> e dos <b>itens dos pedidos</b>.<br>Campos previstos: código, descrição, unidade, preço, NCM.')},
 meios(){const rows=[...grupo(P,r=>(r.tipo||'—')+'|'+r.conta)].map(([k,a])=>({id:k,tipo:a[0].tipo||'—',conta:a[0].conta,n:a.length,val:sum(a)}));
  grade('Documento × Conta de destino',[{h:'Documento',f:x=>esc(x.tipo),v:x=>x.tipo},{h:'Conta',f:x=>esc(x.conta),v:x=>x.conta},{h:'Parcelas',f:x=>x.n,v:x=>x.n,r:1},{h:'Valor',f:x=>brl(x.val),v:x=>x.val,r:1}],rows,null,sum(rows))},
 pistas(){document.getElementById('vtitle').textContent='Pistas do espelho';
  const L=META.pistas||[];document.getElementById('grid').innerHTML=L.length?L.map(p=>'<div class="pista"><h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p><div class="q">❓ '+esc(p[2])+'</div></div>').join(''):'<div class="empty">Sem pistas para estes dados.</div>';

   p.a.map((r,i)=>'<tr data-k="'+esc(r.k)+'" style="cursor:pointer"><td>'+(i+1)+'</td><td><b>'+esc(r.conta)+'</b></td><td><b>'+esc(r.meio||'—')+'</b></td><td><b>VENDAS:VENDAS PRODUTOS</b></td><td><b>'+fd(r.venc)+'</b></td><td class="r"><b>'+brl(r.val)+'</b></td><td>'+tag(r.st)+'</td></tr>').join('')+

/* ===== carregar CSV/JSON local ===== */
function parseCSV(t){const sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
   if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
   else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=''}else if(c==='\n'){row.push(cur.replace(/\r$/,''));rows.push(row);row=[];cur=''}else cur+=c}
  if(cur||row.length){row.push(cur);rows.push(row)}
  const h=rows.shift().map(x=>x.trim());return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])))}
document.getElementById('arq').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();
  try{const o=f.name.endsWith('.json')?JSON.parse(t):{parcelas:parseCSV(t)};carregar({meta:{fonte:'Arquivo local: '+f.name+' (só neste navegador)',hoje:HOJE,pistas:META.pistas},parcelas:o.parcelas||o});S.view='pedidos';S.mod='Comercial';S.tab='VENDAS';render()}
  catch(err){vazio('Erro ao ler arquivo',esc(err.message))}};
render();
